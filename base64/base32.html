		<div class="about-base64" style="margin-top:12px;">
			<h2>Base32 工作原理</h2>
			<ul>
				<li>分组：输入字节被处理为 5 位一组；每 5 位映射为一个字符。</li>
				<li>字母表：RFC 4648 采用 A–Z 与 2–7 共 32 个符号；输出按规范为大写。</li>
				<li>填充：输出长度是 8 的倍数；必要时追加 <code>=</code>。</li>
				<li>空白：解码时通常忽略空格与换行。</li>
				<li>用途：面向文本通道的表示方式；不是加密或压缩。</li>

</script>
<script>
	function $b(id){ return document.getElementById(id); }

	// RFC 4648 Base32 alphabet (no lowercase)
	const B32_ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';

	function base32Encode(bytes) {
		let output = '';
		let buffer = 0;
		let bitsLeft = 0;
		for (let i = 0; i < bytes.length; i++) {
			buffer = (buffer << 8) | bytes[i];
			bitsLeft += 8;
			while (bitsLeft >= 5) {
				const index = (buffer >> (bitsLeft - 5)) & 31;
				bitsLeft -= 5;
				output += B32_ALPHABET[index];
			}
		}
		if (bitsLeft > 0) {
			const index = (buffer << (5 - bitsLeft)) & 31;
			output += B32_ALPHABET[index];
		}
		// Padding to multiple of 8 chars
		while (output.length % 8 !== 0) output += '=';
		return output;
	}

	function base32Decode(str) {
		const clean = str.replace(/\s+/g, '').toUpperCase();
		let buffer = 0;
		let bitsLeft = 0;
		const out = [];
		for (let i = 0; i < clean.length; i++) {
			const c = clean[i];
			if (c === '=') break;
			const val = B32_ALPHABET.indexOf(c);
			if (val === -1) throw new Error('Invalid Base32 character: ' + c);
			buffer = (buffer << 5) | val;
			bitsLeft += 5;
			if (bitsLeft >= 8) {
				bitsLeft -= 8;
				out.push((buffer >> bitsLeft) & 0xff);
			}
		}
		return new Uint8Array(out);
	}

	function encodeTextToBase32(text) {
		const enc = new TextEncoder();
		return base32Encode(enc.encode(text));
	}

	function decodeBase32ToText(b32) {
		const dec = new TextDecoder();
		return dec.decode(base32Decode(b32));
	}

	function updateB32Counts() {
		$b('b32_in_len').textContent = String($b('b32_input').value.length);
		$b('b32_out_len').textContent = String($b('b32_output').value.length);
	}

	function showB32Error(msg){ $b('b32_error').textContent = msg || ''; }

	document.addEventListener('DOMContentLoaded', function(){
		$b('b32_input').addEventListener('input', updateB32Counts);
		updateB32Counts();

		$b('b32_encodeBtn').addEventListener('click', function(){
			showB32Error('');
			try {
				$b('b32_output').value = encodeTextToBase32($b('b32_input').value);
			} catch(e){ showB32Error('Encode failed: ' + e.message); }
			updateB32Counts();
		});

		$b('b32_decodeBtn').addEventListener('click', function(){
			showB32Error('');
			try {
				// Decode from right (output) to left (input)
				$b('b32_input').value = decodeBase32ToText($b('b32_output').value.trim());
			} catch(e){ showB32Error('Decode failed: ' + e.message + ' (invalid Base32)'); }
			updateB32Counts();
		});

		$b('b32_swapBtn').addEventListener('click', function(){
			const t = $b('b32_input').value;
			$b('b32_input').value = $b('b32_output').value;
			$b('b32_output').value = t;
			updateB32Counts();
		});

		$b('b32_clearBtn').addEventListener('click', function(){
			$b('b32_input').value = '';
			$b('b32_output').value = '';
			showB32Error('');
			updateB32Counts();
		});

		$b('b32_copyInBtn').addEventListener('click', async function(){
			const text = $b('b32_input').value;
			try { await navigator.clipboard.writeText(text); } catch(_) { }
		});

		$b('b32_copyOutBtn').addEventListener('click', async function(){
			const text = $b('b32_output').value;
			try { await navigator.clipboard.writeText(text); } catch(_) { }
		});
	});
</script>
