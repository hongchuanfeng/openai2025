			<h2>Base62 工作原理</h2>
			<ul>
				<li>字母表：0–9、A–Z、a–z 共 62 个符号。</li>
				<li>编码：将输入字节视为基数 256 的大整数，通过反复除法转换为基数 62。</li>
				<li>解码：将 base‑62 数字累加还原为基数 256 的字节（逆过程）。</li>
				<li>变体：部分实现会调整字母表顺序；请确保双方使用一致的字符集。</li>
				<li>说明：Base62 是文本表示，用于紧凑 ID/短链接，并非加密。</li>

</script>
<script>
	function $b(id){ return document.getElementById(id); }

	// Common Base62 alphabet: 0-9, A-Z, a-z
	const B62_ALPHABET = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
	const B62_MAP = (() => { const m = new Map(); for (let i=0;i<B62_ALPHABET.length;i++) m.set(B62_ALPHABET[i], i); return m; })();

	function bytesToBase62(bytes) {
		if (bytes.length === 0) return '';
		let digits = [0]; // base62 little-endian digits
		for (let i = 0; i < bytes.length; i++) {
			let carry = bytes[i];
			for (let j = 0; j < digits.length; j++) {
				const x = (digits[j] << 8) + carry;
				digits[j] = Math.floor(x / 62);
				carry = x % 62;
			}
			while (carry > 0) { digits.push(carry % 62); carry = Math.floor(carry / 62); }
		}
		let out = '';
		for (let q = digits.length - 1; q >= 0; q--) out += B62_ALPHABET[digits[q]];
		return out;
	}

	function base62ToBytes(str) {
		if (!str) return new Uint8Array(0);
		let bytes = [0]; // base256 little-endian bytes
		for (let i = 0; i < str.length; i++) {
			const ch = str[i];
			const val = B62_MAP.get(ch);
			if (val === undefined) throw new Error('Invalid Base62 character: ' + ch);
			let carry = val;
			for (let j = 0; j < bytes.length; j++) {
				const x = bytes[j] * 62 + carry;
				bytes[j] = x & 0xff;
				carry = x >> 8;
			}
			while (carry > 0) { bytes.push(carry & 0xff); carry >>= 8; }
		}
		return new Uint8Array(bytes.reverse());
	}

	function encodeTextToBase62(text) {
		const enc = new TextEncoder();
		return bytesToBase62(enc.encode(text));
	}

	function decodeBase62ToText(b62) {
		const dec = new TextDecoder();
		return dec.decode(base62ToBytes(b62));
	}

	function updateB62Counts() {
		$b('b62_in_len').textContent = String($b('b62_input').value.length);
		$b('b62_out_len').textContent = String($b('b62_output').value.length);
	}

	function showB62Error(msg){ $b('b62_error').textContent = msg || ''; }

	document.addEventListener('DOMContentLoaded', function(){
		$b('b62_input').addEventListener('input', updateB62Counts);
		updateB62Counts();

		$b('b62_encodeBtn').addEventListener('click', function(){
			showB62Error('');
			try {
				$b('b62_output').value = encodeTextToBase62($b('b62_input').value);
			} catch(e){ showB62Error('Encode failed: ' + e.message); }
			updateB62Counts();
		});

		$b('b62_decodeBtn').addEventListener('click', function(){
			showB62Error('');
			try {
				// Decode from right (output) to left (input)
				$b('b62_input').value = decodeBase62ToText($b('b62_output').value.trim());
			} catch(e){ showB62Error('Decode failed: ' + e.message + ' (invalid Base62)'); }
			updateB62Counts();
		});

		$b('b62_swapBtn').addEventListener('click', function(){
			const t = $b('b62_input').value;
			$b('b62_input').value = $b('b62_output').value;
			$b('b62_output').value = t;
			updateB62Counts();
		});

		$b('b62_clearBtn').addEventListener('click', function(){
			$b('b62_input').value = '';
			$b('b62_output').value = '';
			showB62Error('');
			updateB62Counts();
		});

		$b('b62_copyInBtn').addEventListener('click', async function(){
			const text = $b('b62_input').value;
			try { await navigator.clipboard.writeText(text); } catch(_) { }
		});

		$b('b62_copyOutBtn').addEventListener('click', async function(){
			const text = $b('b62_output').value;
			try { await navigator.clipboard.writeText(text); } catch(_) { }
		});
	});
</script>
