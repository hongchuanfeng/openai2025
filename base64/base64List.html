</script>
<script>
	(function(){
		const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
		const $ = id => document.getElementById(id);

		function toBinaryString(bytes) {
			let s = '';
			for (let i = 0; i < bytes.length; i++) {
				s += bytes[i].toString(2).padStart(8, '0');
			}
			return s.padEnd(24, '0').slice(0, 24);
		}

		function encodeChunk(bytes3) {
			// bytes3: Uint8Array(1..3)
			const b0 = bytes3[0] || 0;
			const b1 = bytes3[1] || 0;
			const b2 = bytes3[2] || 0;
			const twentyFour = (b0 << 16) | (b1 << 8) | b2;
			const sextets = [
				(twentyFour >> 18) & 63,
				(twentyFour >> 12) & 63,
				(twentyFour >> 6) & 63,
				twentyFour & 63
			];
			let out = [
				ALPHABET[sextets[0]],
				ALPHABET[sextets[1]],
				ALPHABET[sextets[2]],
				ALPHABET[sextets[3]]
			];
			let pad = '';
			if (bytes3.length === 1) { out[2] = '='; out[3] = '='; pad = '=='; }
			else if (bytes3.length === 2) { out[3] = '='; pad = '='; }
			return {sextets, out: out.join(''), pad, bin: toBinaryString(bytes3)};
		}

		function encodeAndExplain(text) {
			const encoder = new TextEncoder();
			const bytes = encoder.encode(text);
			const rows = [];
			let output = '';
			for (let i = 0; i < bytes.length; i += 3) {
				const chunk = bytes.subarray(i, Math.min(i + 3, bytes.length));
				const { sextets, out, pad, bin } = encodeChunk(chunk);
				output += out;
				rows.push({
					index: (i / 3) + 1,
					decBytes: Array.from(chunk).join(', '),
					hexBytes: Array.from(chunk).map(b => '0x' + b.toString(16).padStart(2,'0')).join(', '),
					bin24: bin,
					sextets: sextets.map(x => x.toString(2).padStart(6,'0')).join(' | '),
					idxChars: sextets.map(x => x + ' → ' + ALPHABET[x]).join(', '),
					out,
					pad
				});
			}
			return { output, rows };
		}

		function renderAlphabet() {
			const body = $('b64list_alphaBody');
			body.innerHTML = '';
			for (let r = 0; r < 16; r++) {
				const c0 = r;
				const c1 = r + 16;
				const c2 = r + 32;
				const c3 = r + 48;
				const tr = document.createElement('tr');
				[ c0, c1, c2, c3 ].forEach(idx => {
					const tdIdx = document.createElement('td');
					tdIdx.style.border = '1px solid #eee';
					tdIdx.style.padding = '6px';
					tdIdx.textContent = String(idx);
					const tdCh = document.createElement('td');
					tdCh.style.border = '1px solid #eee';
					tdCh.style.padding = '6px';
					tdCh.textContent = ALPHABET[idx];
					tr.appendChild(tdIdx);
					tr.appendChild(tdCh);
				});
				body.appendChild(tr);
			}
		}

		function buildTable() {
			const text = $('b64list_input').value;
			const { output, rows } = encodeAndExplain(text);
			$('b64list_output').textContent = output;
			const tbody = $('b64list_body');
			tbody.innerHTML = '';
			rows.forEach(row => {
				const tr = document.createElement('tr');
				function td(v){ const d=document.createElement('td'); d.style.border='1px solid #eee'; d.style.padding='6px'; d.textContent=v; return d; }
				tr.appendChild(td(row.index));
				tr.appendChild(td(row.decBytes || '-'));
				tr.appendChild(td(row.hexBytes || '-'));
				tr.appendChild(td(row.bin24));
				tr.appendChild(td(row.sextets));
				tr.appendChild(td(row.idxChars));
				tr.appendChild(td(row.out));
				tr.appendChild(td(row.pad || ''));
				tbody.appendChild(tr);
			});
		}

		document.addEventListener('DOMContentLoaded', function(){
			renderAlphabet();
			$('b64list_buildBtn').addEventListener('click', buildTable);
			$('b64list_clearBtn').addEventListener('click', function(){
				$('b64list_input').value = '';
				$('b64list_output').textContent = '';
				$('b64list_body').innerHTML = '';
			});
		});
	})();
</script>
